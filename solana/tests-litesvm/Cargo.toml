[package]
name = "bonawork-tests"
version = "0.1.0"
edition = "2021"
publish = false

# A separate workspace on purpose: these host-side tests use LiteSVM's Solana
# crate versions, the program uses Anchor's. They talk only through bytes.
[workspace]

[dependencies]

[dev-dependencies]
litesvm = "=0.18.2"
litesvm-token = "=0.18.2"
solana-address = { version = "~2.7", features = ["curve25519"] }
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["wincode"] }
solana-instruction = "~3.5"
solana-clock = "~3.2"
spl-token-interface = "3"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
bs58 = "0.5"
