name: CI

on:
  push:
    branches: [main, "integration/**", "solana/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # The build must never need secrets. Runtime configuration is set on Vercel.
          NEXT_TELEMETRY_DISABLED: "1"

  solana-program:
    name: Solana program (build + LiteSVM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_VERSION: v4.1.2
    steps:
      - uses: actions/checkout@v4
      - name: Cache Solana CLI and platform tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}
      - name: Install Solana CLI
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            solana
            solana/tests-litesvm
      - name: Build program with the test admin key
        working-directory: solana
        run: cargo build-sbf --manifest-path programs/bonawork/Cargo.toml --features localtest
      - name: LiteSVM tests (fake clock, real program)
        working-directory: solana/tests-litesvm
        run: cargo test -- --test-threads=4
      - name: Build program for devnet
        working-directory: solana
        run: cargo build-sbf --manifest-path programs/bonawork/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: bonawork-program
          path: solana/target/deploy/bonawork.so

  contracts:
    name: BonaRegistry contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bona/contracts test

  verifier:
    name: BonaBlock Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bona-verify typecheck
      - run: pnpm --filter bona-verify test
